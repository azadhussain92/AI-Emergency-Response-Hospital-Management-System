<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Department</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #eef6fb;
        }

        .navbar {
            background: #1677b8;
        }

        .department-card {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .08);
        }

        .title {
            color: #1677b8;
            font-weight: 700;
        }

        .subtitle {
            color: #777;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cedae3;
            border-radius: 8px;
        }

        form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .add-btn {
            background: #1677b8;
            color: white;
            border: none;
            padding: 11px 28px;
            border-radius: 8px;
            font-weight: 600;
        }

        .add-btn:hover {
            background: #125f91;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">

            <a href="{% url 'hospital_list' %}" class="navbar-brand fw-bold fs-4">
                🏥 Hospital Management
            </a>
            <a href="{% url 'hospital_list' %}" class="btn btn-outline-light">Hospitals</a>
        </div>
    </nav>
    <!-- Department Form -->
    <div class="department-card">
        <h2 class="title">🏥 Add Department</h2>
        <p class="subtitle">Create a new department and assign it to a hospital.</p>
        <hr class="mb-4">
        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="add-btn">➕ Add Department</button>
                <a href="{% url 'hospital_list' %}" class="btn btn-secondary">← Back</a>
            </div>
        </form>
    </div>
</body>

</html>
