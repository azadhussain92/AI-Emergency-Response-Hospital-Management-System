<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f8fbff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .register-box {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #087fdb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d5dce3;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #087fdb;
            background: white;
            box-shadow: 0 0 0 3px rgba(8, 127, 219, 0.10);
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #087fdb, #0056a6);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            opacity: 0.9;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login a {
            color: #087fdb;
            font-weight: bold;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        /* Bootstrap responsive */
        @media (max-width: 576px) {
            body {
                padding: 15px;
            }

            .register-box {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>
    <div class="register-box shadow">
        <!-- Logo -->
        <div class="logo">🏥</div>
        <h1>Create Account</h1>
        <p class="subtitle">
            Register for Hospital Management System
        </p>

        <!-- Registration Form -->
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="register-btn btn btn-primary">Register</button>
        </form>

        <p class="login">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
